[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-transcriptomics-cell-cell-engine"
version = "2.0.0"
description = "SpatialCellComm: Ligand-Receptor Interaction & Spatial Proximity Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
spatial-transcriptomics-cell-cell-engine = "spatial_cell_comm.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/spatial-transcriptomics-cell-cell-engine"
Repository = "https://github.com/abusuraihsakhri/spatial-transcriptomics-cell-cell-engine.git"
